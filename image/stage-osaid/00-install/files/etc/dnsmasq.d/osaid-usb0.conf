# DHCP for the laptop on the USB link. Address only: no router and no DNS
# server are offered, so the laptop keeps its own internet connection.
interface=usb0
bind-dynamic
except-interface=wlan0
no-dhcp-interface=wlan0
port=0
dhcp-range=10.55.0.10,10.55.0.50,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
dhcp-leasefile=/run/dnsmasq-usb0.leases
